<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <style>
        :root { --fondo:#eef2f7; --tinta:#1b2a3a; --azul:#1f5fbf; --borde:#b8c4d3; --error:#b3261e; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center;
               background:var(--fondo); color:var(--tinta);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { width:min(92vw, 380px); }
        h1 { font-size:2rem; margin:0 0 1.5rem; }
        label { display:block; font-weight:600; margin-bottom:.35rem; }
        input { width:100%; padding:.7rem .8rem; margin-bottom:1.1rem; font-size:1rem;
                border:2px solid var(--borde); border-radius:8px; background:#fff; color:inherit; }
        input:focus-visible, button:focus-visible { outline:3px solid var(--azul); outline-offset:2px; }
        button { width:100%; padding:.8rem; font-size:1.1rem; font-weight:600; cursor:pointer;
                 border:0; border-radius:8px; background:var(--azul); color:#fff; }
        .aviso { margin-bottom:1rem; font-weight:600; }
        .error { color:var(--error); }
    </style>
</head>
<body>
<main>
    <h1>Iniciar sesión</h1>
    <p class="aviso error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
    <p class="aviso" th:if="${param.logout}">Has cerrado sesión.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
