# Puerto: APP_PORT (del .env o del entorno); 5000 por defecto (el que espera Elastic Beanstalk)
server.port=${APP_PORT:5000}

# Carga opcional del fichero .env (formato CLAVE=valor) situado en el directorio de ejecución.
# En Render/Railway/Elastic Beanstalk no habrá .env: las variables vendrán del entorno de la plataforma.
spring.config.import=optional:file:.env[.properties]

# Credenciales del único usuario autorizado
app.user=${APP_USER}
app.pwd=${APP_PWD}
