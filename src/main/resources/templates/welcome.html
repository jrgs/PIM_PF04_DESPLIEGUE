<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bienvenido</title>
    <style>
        :root { --fondo:#eef2f7; --tinta:#1b2a3a; --azul:#1f5fbf; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
               background:var(--fondo); color:var(--tinta);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { padding:1.5rem; }
        h1 { font-size:clamp(2.5rem, 9vw, 6rem); margin:0 0 3rem; line-height:1.1; overflow-wrap:anywhere; }
        button { font-size:clamp(1.5rem, 4vw, 2.5rem); font-weight:600; cursor:pointer;
                 padding:1.2rem 3.5rem; border:0; border-radius:14px; background:var(--azul); color:#fff; }
        button:focus-visible { outline:4px solid var(--tinta); outline-offset:4px; }
    </style>
</head>
<body>
<main>
    <h1>Bienvenido, <span th:text="${user}">usuario</span></h1>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Cerrar sesión</button>
    </form>
</main>
</body>
</html>
